[package]
name = "aethos"
version = "0.1.0"
description = "Aethos desktop client"
authors = ["Aethos maintainers"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
ciborium = "0.2"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
chrono = { version = "0.4", features = ["serde"] }
qrcode = "0.14"
rand = "0.8"
rqrr = "0.9"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"
socket2 = { version = "0.5", features = ["all"] }
tauri = { version = "2", default-features = false, features = ["wry", "macos-private-api"] }
tauri-plugin-playwright = { version = "0.2", optional = true }
tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
url = "2"
webbrowser = "1"
flume = "0.11"
mdns-sd = "0.18"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2.12", features = ["json"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"
dbus-crossroads = "0.5"

[features]
default = []
e2e-testing = ["tauri-plugin-playwright"]

[dev-dependencies]
rand = "0.8"
